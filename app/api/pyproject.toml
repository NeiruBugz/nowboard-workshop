[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "argon2-cffi>=23.1",
    "alembic>=1.14",
    "fastapi[standard]>=0.136.0",
    "greenlet>=3.4.0",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.0",
    "sqlmodel>=0.0.22",
    "structlog>=24.1",
]

[project.scripts]
export-openapi = "app.scripts.export_openapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff>=0.9",
]
test = [
    "httpx>=0.28",
    "pytest>=8.1",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "UP", "B", "C4",
    "SIM", "FA", "ISC", "ICN", "RET", "TC", "PTH", "RUF",
]
ignore = ["ISC001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
